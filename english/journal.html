<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Journal</title><link rel="stylesheet" href="css/english.css"></head><body><header><a class="brand" href="index.html">← ENGLISH LAB</a><nav><a href="index.html">Dashboard</a><a href="journal.html">Journal</a><a href="learn.html">Learn</a><a href="quiz.html">Quiz</a><a href="review.html">Review</a><a href="progress.html">Progress</a><a href="mistakes.html">Mistakes</a></nav></header><main><section class="pagehead"><p class="eyebrow">DAILY JOURNAL</p><h1>What did you do today?</h1><p>Write naturally in Bangla or English. Your entry stays in this browser.</p></section><section class="card"><label>Date<input id="date" type="date"></label><label>Today's activities<textarea id="activities" rows="8" placeholder="সকালে উঠেছি, নাশতা করেছি, বিকেলে কোডিং করেছি...\nOr write directly in English."></textarea></label><label>English version<textarea id="english" rows="7" placeholder="I woke up in the morning. I had breakfast..."></textarea></label><label>New words (comma separated)<input id="words" placeholder="breakfast, practice, improve"></label><label>Grammar learned<textarea id="grammar" rows="4" placeholder="Example: I went / I did / I have..." ></textarea></label><button class="btn" id="save">Save today's entry</button><p id="saved" class="success"></p></section></main><script src="js/app.js"></script><script>const d=document.getElementById('date');d.value=today();const e=loadEntry(d.value);if(e){activities.value=e.activities||'';english.value=e.english||'';words.value=(e.words||[]).join(', ');grammar.value=e.grammar||''}save.onclick=()=>{saveEntry({date:d.value,activities:activities.value,english:english.value,words:words.value.split(',').map(x=>x.trim()).filter(Boolean),grammar:grammar.value});saved.textContent='Saved successfully.'}</script></body></html>
