<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Quiz</title><link rel="stylesheet" href="css/english.css"></head><body><header><a class="brand" href="index.html">← ENGLISH LAB</a><nav><a href="index.html">Dashboard</a><a href="journal.html">Journal</a><a href="learn.html">Learn</a><a href="quiz.html">Quiz</a><a href="review.html">Review</a><a href="progress.html">Progress</a><a href="mistakes.html">Mistakes</a></nav></header><main><section class="pagehead"><p class="eyebrow">DAILY QUIZ</p><h1>Practice what you learned</h1><p>Questions are generated from your journal words and activity.</p></section><section class="card" id="quiz"></section></main><script src="js/app.js"></script><script>const e=loadEntry(today()),words=(e&&e.words)||[];const qs=[];if(words.length)words.slice(0,3).forEach(w=>qs.push({q:'Which word did you learn today?',a:w,opts:[w,'tomorrow','yesterday','never']}));if(e&&e.english)qs.push({q:'Did your journal include an English version?',a:'Yes',opts:['Yes','No','Maybe','Never']});if(!qs.length){quiz.innerHTML='<h2>No quiz available</h2><p>Write today’s journal and add at least one new word.</p><a class="btn" href="journal.html">Go to journal</a>'}else{quiz.innerHTML=qs.map((x,i)=>'<div class="question"><h3>'+(i+1)+'. '+esc(x.q)+'</h3>'+x.opts.map(o=>'<label class="option"><input type="radio" name="q'+i+'" value="'+esc(o)+'"> '+esc(o)+'</label>').join('')+'</div>').join('')+'<button class="btn" id="submit">Submit quiz</button><div id="result"></div>';submit.onclick=()=>{let score=0;qs.forEach((x,i)=>{const v=document.querySelector('input[name=q'+i+']:checked');if(v&&v.value===x.a)score++});const pct=Math.round(score/qs.length*100);saveQuiz({date:today(),score,total:qs.length,pct,attempts:(getQuiz(today())?.attempts||0)+1});result.innerHTML='<h2>Score: '+score+'/'+qs.length+' ('+pct+'%)</h2><p>Attempt saved. Try again to improve your score.</p>'}}</script></body></html>
