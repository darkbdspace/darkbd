<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Learning</title><link rel="stylesheet" href="css/english.css"></head><body><header><a class="brand" href="index.html">← ENGLISH LAB</a><nav><a href="index.html">Dashboard</a><a href="journal.html">Journal</a><a href="learn.html">Learn</a><a href="quiz.html">Quiz</a><a href="review.html">Review</a><a href="progress.html">Progress</a><a href="mistakes.html">Mistakes</a></nav></header><main><section class="pagehead"><p class="eyebrow">DAILY LEARNING</p><h1>Today's words & sentences</h1></section><div id="content"></div></main><script src="js/app.js"></script><script>const e=loadEntry(today());const c=document.getElementById('content');if(!e){c.innerHTML='<section class="card"><h2>No journal entry yet</h2><p>Write today’s journal first.</p><a class="btn" href="journal.html">Write journal</a></section>'}else{c.innerHTML='<section class="card"><h2>Simple English</h2><p>'+esc(e.english||'Add an English version to your journal.')+'</p><h2>New vocabulary</h2><div class="chips">'+(e.words||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div><h2>Grammar note</h2><p>'+esc(e.grammar||'No grammar note yet.')+'</p></section>'}</script></body></html>
