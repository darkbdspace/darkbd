<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review</title><link rel="stylesheet" href="css/english.css"></head><body><header><a class="brand" href="index.html">← ENGLISH LAB</a><nav><a href="index.html">Dashboard</a><a href="journal.html">Journal</a><a href="learn.html">Learn</a><a href="quiz.html">Quiz</a><a href="review.html">Review</a><a href="progress.html">Progress</a><a href="mistakes.html">Mistakes</a></nav></header><main><section class="pagehead"><p class="eyebrow">SPACED REVIEW</p><h1>7 / 14 / 21 / 30 day reviews</h1></section><div class="grid" id="reviews"></div></main><script src="js/app.js"></script><script>const r=document.getElementById('reviews'), entries=getEntries();[7,14,21,30].forEach(n=>{const d=new Date();d.setDate(d.getDate()-n);const key=iso(d),e=loadEntry(key);r.innerHTML+=`<article class="card"><h2>${n} Day Review</h2><p>${e?'Review entry from '+key+'.':'No entry found for '+key+'.'}</p>${e?'<a class="btn ghost" href="journal.html">Review journal</a>':''}</article>`})</script></body></html>
